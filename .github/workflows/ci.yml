name: CI

# Phase 20 — runs the full automated test suite (backend Django tests +
# frontend Vitest) on every push and pull request, so a red build is
# visible before code lands on main rather than being caught manually.

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Django) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values, CI-only -- never real secrets. django-environ falls
      # back to real environment variables when no .env file is present.
      SECRET_KEY: ci-only-not-a-real-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: db.sqlite3
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run the test suite
        run: python manage.py test accounts crops scans advisory -v 2

  frontend:
    name: Frontend (Vitest) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npx vitest run

      - name: Build
        run: npm run build
